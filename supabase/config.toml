project_id = "bjbc"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = false

[studio]
enabled = true
port = 54323

[local_smtp]
enabled = false

[storage]
enabled = true
file_size_limit = "5MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
minimum_password_length = 12

[auth.rate_limit]
sign_in_sign_ups = 30
token_refresh = 150
sms_sent = 0

[auth.email]
enable_signup = false
enable_confirmations = true

[auth.sms]
enable_signup = true
enable_confirmations = false

[auth.sms.twilio]
# LOCAL SENTINELS ONLY, not a Twilio account. CLI requires a provider to keep
# phone login enabled. The PostgreSQL hook below rejects every SMS request.
enabled = true
account_sid = "local-disabled"
message_service_sid = "local-disabled"
auth_token = "local-disabled-not-a-credential"

[auth.hook.send_sms]
enabled = true
uri = "pg-functions://postgres/app_private/reject_sms_delivery"

[functions.receipt-view]
verify_jwt = true

[functions.receipt-submit]
verify_jwt = true

# These endpoints verify member JWTs or their own scoped opaque capabilities.
[functions.guest-access]
verify_jwt = false

[functions.account-recovery]
verify_jwt = false

[functions.settings-qr]
verify_jwt = true
